spring.application.name=backend

# Bind to all interfaces so the app is accessible from other devices on the network
server.address=0.0.0.0

# Logging configs
logging.level.org.springframework=DEBUG
logging.level.web=DEBUG
logging.level.org.springframework.security=DEBUG

# PostgreSQL database connection (Neon)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ML microservice URL (anomaly detection, crop recommendation, yield prediction)
ml.service.url=http://localhost:5001

# Geoapify Geocoding API Key (configured via GEOAPIFY_API_KEY environment variable)
geoapify.api.key=${GEOAPIFY_API_KEY:}
